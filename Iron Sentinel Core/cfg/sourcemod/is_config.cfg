// ============================================================
//  IRON SENTINEL ANTICHEAT v1.1.2 -- is_config.cfg
// ============================================================
//
// This file documents and sets every ConVar registered by is_core.sp
// (all 86, including the settings each individual module also knows how
// to create on its own if is_core.smx is somehow not loaded first).
// Each entry is documented in English and Russian.
//
// This file is loaded automatically by SourceMod's AutoExecConfig on
// plugin start. Values here override the compiled-in defaults; delete a
// line (or the whole file) and reload the plugin to regenerate defaults.
//
// EN: Punitive actions (kick/ban/autoban/autokick) default to OFF across
//     this whole file. Detection and logging default to ON. Turn on the
//     action cvar for a module once you trust its detections for your
//     server before it can kick or ban anyone on its own.
// RU: Карательные действия (kick/ban/autoban/autokick) по умолчанию
//     ВЫКЛЮЧЕНЫ во всём этом файле. Обнаружение и логирование включены
//     по умолчанию. Включайте действие для модуля только после того, как
//     убедитесь в точности его детекций на вашем сервере.
// ============================================================

// ------------------------------------------------------------
//  1. CORE
// ------------------------------------------------------------

// EN: Iron Sentinel AntiCheat version (read-only marker, do not edit by hand)
// RU: Версия Iron Sentinel AntiCheat (только для чтения, не редактировать вручную)
is_version "1.1.2"

// EN: Ban duration in minutes (0 = permanent)
// RU: Длительность бана в минутах (0 = навсегда)
is_ban_duration "0"

// EN: Enable logging
// RU: Включить логирование
is_logging "1"

// EN: Show welcome message
// RU: Показывать приветственное сообщение
is_welcomemsg "1"

// ------------------------------------------------------------
//  2. COMMAND BLOCKER
// ------------------------------------------------------------

// EN: Kick for dangerous commands
// RU: Кикать за опасные команды
is_cmd_autokick "0"

// EN: Ban for dangerous commands
// RU: Банить за опасные команды
is_cmd_autoban "0"

// EN: Log dangerous commands
// RU: Логировать опасные команды
is_cmd_logging "1"

// ------------------------------------------------------------
//  3. CVAR CHECKER
// ------------------------------------------------------------

// EN: Kick for suspicious cvars
// RU: Кикать за подтверждённые подозрительные настройки
is_cvars_autokick "0"

// EN: Ban for suspicious cvars
// RU: Банить за подтверждённые подозрительные настройки
is_cvars_autoban "0"

// EN: Cvar check interval (seconds)
// RU: Интервал полного прохода списка (секунд)
is_cvars_check_interval "60.0"

// EN: Log suspicious cvars
// RU: Логировать подозрительные настройки
is_cvars_logging "1"

