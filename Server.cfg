tv_autorecord "0"                   // Автоматически записывать демки (0 = выключено)
tv_delaymapchange "0"               // Задерживать смену карты до завершения трансляции
tv_delaymapchange_protect "1"       // Защита от ручной смены карты во время трансляции
tv_deltacache "2"                   // Кэш дельта-сущностей (0=выкл, 1=вкл, 2=оптимальный)
tv_transmitall "0"                  // 0 = только видимые сущности, 1 = все сущности
tv_relayvoice "1"                   // Ретранслировать голос (0=выкл, 1=вкл)
tv_autoretry "1"                    // Автоматически переподключаться при потере связи
tv_overridemaster "0"               // Переопределить мастер-сервер SourceTV
tv_debug "0"                        // Отладка SourceTV (0=выкл)
tv_title "CS:S Classic SourceTV"    // Заголовок для интерфейса зрителей

// ==========================================
// ЗАГРУЗКА БАНОВ И СОХРАНЕНИЕ
// ==========================================
exec banned_user.cfg                // Загрузить список забаненных по SteamID
exec banned_ip.cfg                  // Загрузить список забаненных по IP
writeid                             // Сохранить список забаненных SteamID в banned_user.cfg
writeip                             // Сохранить список забаненных IP в banned_ip.cfg
