name: Iron Sentinel CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SOURCEMOD_VERSION: 1.12.0.7249

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run static tests
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest -q

  sourcemod-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download SourceMod ${{ env.SOURCEMOD_VERSION }}
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/alliedmodders/sourcemod/releases/download/${env:SOURCEMOD_VERSION}/sourcemod-1.12.0-git7249-windows.zip" -OutFile sm.zip
          Expand-Archive sm.zip -DestinationPath sm
      - name: Compile all SourcePawn plugins (warnings are errors)
        shell: powershell
        run: .\tools\compile_ci_windows.ps1
      - name: Upload compiled plugins
        uses: actions/upload-artifact@v4
        with:
          name: iron-sentinel-v1.1.2-smx
          path: ci-build/plugins/*.smx

  package:
    needs: sourcemod-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iron-sentinel-v1.1.2-smx
          path: ci-build/plugins
      - name: Build release package
        run: |
          mkdir -p ci-release/addons/sourcemod/plugins
          cp ci-build/plugins/*.smx ci-release/addons/sourcemod/plugins/
          cp -r addons/sourcemod/scripting ci-release/addons/sourcemod/
          cp -r addons/sourcemod/configs ci-release/addons/sourcemod/ || true
          cp -r addons/sourcemod/translations ci-release/addons/sourcemod/ || true
          cp -r cfg ci-release/ || true
          cp -r tools ci-release/ || true
          cp -r tests ci-release/ || true
          cp README.md ci-release/ 2>/dev/null || true
          cp LICENSE ci-release/ 2>/dev/null || true
          cp BENCHMARKS.md ci-release/ 2>/dev/null || true
          cp ML_READINESS.md ci-release/ 2>/dev/null || true
          cp AUDIT_REPORT_v1.1.2_FINAL.md ci-release/ 2>/dev/null || true
          cp BUILD_REPORT_v1.1.2_FINAL.md ci-release/ 2>/dev/null || true
          cp TEST_REPORT_v1.1.2_FINAL.md ci-release/ 2>/dev/null || true
          cd ci-release
          zip -r ../Iron.Sentinel.Core.v1.1.2.zip .
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: iron-sentinel-v1.1.2-package
          path: Iron.Sentinel.Core.v1.1.2.zip

  release-on-tag:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iron-sentinel-v1.1.2-package
          path: release-assets
      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "Iron Sentinel ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release-assets/Iron.Sentinel.Core.v1.1.2.zip --clobber
