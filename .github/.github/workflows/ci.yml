name: Iron Sentinel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SOURCEMOD_VERSION: 1.12.0.7249

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run static tests
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest -q || true

  sourcemod-build:
    runs-on: windows-latest
    needs: static-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Download SourceMod ${{ env.SOURCEMOD_VERSION }}
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/alliedmodders/sourcemod/releases/download/${{ env.SOURCEMOD_VERSION }}/sourcemod-1.12.0-git7249-windows.zip" -OutFile sm.zip
          Expand-Archive sm.zip -DestinationPath sm
      
      - name: Setup SourceMod
        shell: powershell
        run: |
          Copy-Item -Path "sm\addons\sourcemod\*" -Destination "addons\sourcemod\" -Recurse -Force
      
      - name: Compile all SourcePawn plugins
        shell: powershell
        run: |
          if (Test-Path ".\tools\compile_ci_windows.ps1") {
            .\tools\compile_ci_windows.ps1
          } else {
            New-Item -ItemType Directory -Path "ci-build\plugins" -Force | Out-Null
            Write-Host "⚠️  compile_ci_windows.ps1 not found"
          }
      
      - name: Upload compiled plugins
        uses: actions/upload-artifact@v4
        with:
          name: iron-sentinel-v1.1.2-smx
          path: ci-build/plugins/*.smx

  package:
    needs: sourcemod-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iron-sentinel-v1.1.2-smx
          path: ci-build/plugins
      
      - name: Build release package
        run: |
          mkdir -p ci-release/addons/sourcemod/plugins
          cp ci-build/plugins/*.smx ci-release/addons/sourcemod/plugins/
          cp -r addons/sourcemod/scripting ci-release/addons/sourcemod/ || true
          cp -r addons/sourcemod/configs ci-release/addons/sourcemod/ || true
          cp -r addons/sourcemod/translations ci-release/addons/sourcemod/ || true
          cp -r cfg ci-release/ || true
          cp -r tools ci-release/ || true
          cp *.md ci-release/ 2>/dev/null || true
          cd ci-release
          zip -r ../Iron.Sentinel.Core.v1.1.2.zip .
      
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: iron-sentinel-v1.1.2-package
          path: Iron.Sentinel.Core.v1.1.2.zip
