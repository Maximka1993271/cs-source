name: Iron Sentinel CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SOURCEMOD_VERSION: 1.12.0.7249
  PLUGIN_VERSION: 1.1.2
  PROJECT_NAME: Iron.Sentinel.Core

jobs:
  # ============================================
  # 1. СТАТИЧЕСКИЕ ТЕСТЫ (Python)
  # ============================================
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest black flake8 mypy
      
      - name: Run Python tests
        run: |
          python3 -m pytest -q tests/ || true
      
      - name: Check code style (Black)
        run: |
          python3 -m black --check tools/ || true
      
      - name: Lint Python code
        run: |
          python3 -m flake8 tools/ || true

  # ============================================
  # 2. ЛИНТИНГ SOURCEPAWN КОДА
  # ============================================
  lint-sourcepawn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install SourcePawn Linter
        run: |
          curl -L https://github.com/Sarrus/sourcepawn-linter/releases/latest/download/sourcepawn-linter-linux -o splinter
          chmod +x splinter
          sudo mv splinter /usr/local/bin/
      
      - name: Lint all SourcePawn files
        run: |
          echo "🔍 Linting SourcePawn code..."
          find addons/sourcemod/scripting -name "*.sp" -exec splinter {} \; || true

  # ============================================
  # 3. ПРОВЕРКА ВЕРСИИ И КОНСИСТЕНТНОСТИ
  # ============================================
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check version consistency
        run: |
          echo "📌 Checking version consistency..."
          if grep -q "v${PLUGIN_VERSION}" addons/sourcemod/scripting/*.sp 2>/dev/null; then
            echo "✅ Version ${PLUGIN_VERSION} found in SourcePawn files"
          else
            echo "⚠️  Version ${PLUGIN_VERSION} not found in SourcePawn files"
          fi
          
          if grep -q "${PLUGIN_VERSION}" README.md 2>/dev/null; then
            echo "✅ Version ${PLUGIN_VERSION} found in README.md"
          else
            echo "⚠️  Version ${PLUGIN_VERSION} not found in README.md"
          fi

  # ============================================
  # 4. КОМПИЛЯЦИЯ PLUGIN (Windows)
  # ============================================
  sourcemod-build:
    runs-on: windows-latest
    needs: [lint-sourcepawn, version-check]
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache SourceMod
        uses: actions/cache@v4
        id: cache-sm
        with:
          path: sm
          key: ${{ runner.os }}-sourcemod-${{ env.SOURCEMOD_VERSION }}
      
      - name: Download SourceMod ${{ env.SOURCEMOD_VERSION }}
        if: steps.cache-sm.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          Write-Host "📥 Downloading SourceMod..."
          Invoke-WebRequest -Uri "https://github.com/alliedmodders/sourcemod/releases/download/${env:SOURCEMOD_VERSION}/sourcemod-1.12.0-git7249-windows.zip" -OutFile sm.zip
          Expand-Archive sm.zip -DestinationPath sm
          Write-Host "✅ SourceMod downloaded"
      
      - name: Setup SourceMod environment
        shell: powershell
        run: |
          Write-Host "🔧 Setting up SourceMod environment..."
          Copy-Item -Path "sm\addons\sourcemod\*" -Destination "addons\sourcemod\" -Recurse -Force
          Write-Host "✅ Environment ready"
      
      - name: Compile all SourcePawn plugins (warnings are errors)
        shell: powershell
        run: |
          Write-Host "🔨 Compiling plugins..."
          if (Test-Path ".\tools\compile_ci_windows.ps1") {
            .\tools\compile_ci_windows.ps1
          } else {
            Write-Host "⚠️  compile_ci_windows.ps1 not found, using default compilation"
            & ".\addons\sourcemod\scripting\compile.exe" *.sp
          }
        continue-on-error: false
      
      - name: List compiled plugins
        shell: powershell
        run: |
          Write-Host "📦 Compiled plugins:"
          Get-ChildItem -Path "ci-build\plugins\*.smx" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  ✅ $($_.Name)"
          }
      
      - name: Upload compiled plugins
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-v${{ env.PLUGIN_VERSION }}-smx
          path: ci-build/plugins/*.smx
        if: success()

  # ============================================
  # 5. ТЕСТИРОВАНИЕ PLUGIN
  # ============================================
  test-plugin:
    runs-on: ubuntu-latest
    needs: sourcemod-build
    if: success()
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-v${{ env.PLUGIN_VERSION }}-smx
          path: ci-build/plugins
      
      - name: Setup test environment
        run: |
          echo "🧪 Setting up test environment..."
          mkdir -p test-env/addons/sourcemod/plugins
          cp ci-build/plugins/*.smx test-env/addons/sourcemod/plugins/
      
      - name: Run plugin tests
        run: |
          if [ -d "tests" ]; then
            echo "Running plugin tests..."
            python3 -m pytest tests/ -v
          else
            echo "ℹ️  No tests found, skipping"
          fi
        continue-on-error: true

  # ============================================
  # 6. СБОРКА РЕЛИЗНОГО ПАКЕТА
  # ============================================
  package:
    needs: [sourcemod-build, test-plugin]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-v${{ env.PLUGIN_VERSION }}-smx
          path: ci-build/plugins
      
      - name: Build release package
        run: |
          RELEASE_DIR="${{ env.PROJECT_NAME }}.v${{ env.PLUGIN_VERSION }}"
          RELEASE_ZIP="${{ env.PROJECT_NAME }}.v${{ env.PLUGIN_VERSION }}.zip"
          
          echo "📦 Building release package: $RELEASE_ZIP"
          
          # Создаем структуру папок
          mkdir -p "${RELEASE_DIR}/addons/sourcemod/plugins"
          mkdir -p "${RELEASE_DIR}/addons/sourcemod/scripting"
          mkdir -p "${RELEASE_DIR}/addons/sourcemod/configs"
          mkdir -p "${RELEASE_DIR}/addons/sourcemod/translations"
          mkdir -p "${RELEASE_DIR}/cfg/sourcemod"
          mkdir -p "${RELEASE_DIR}/logs"
          
          # Копируем собранные плагины
          echo "  📄 Copying plugins..."
          cp ci-build/plugins/*.smx "${RELEASE_DIR}/addons/sourcemod/plugins/" 2>/dev/null || true
          
          # Копируем исходники (если есть)
          echo "  📄 Copying source code..."
          cp -r addons/sourcemod/scripting/* "${RELEASE_DIR}/addons/sourcemod/scripting/" 2>/dev/null || true
          
          # Копируем конфиги
          echo "  📄 Copying configs..."
          cp -r addons/sourcemod/configs/* "${RELEASE_DIR}/addons/sourcemod/configs/" 2>/dev/null || true
          
          # Копируем переводы
          echo "  📄 Copying translations..."
          cp -r addons/sourcemod/translations/* "${RELEASE_DIR}/addons/sourcemod/translations/" 2>/dev/null || true
          
          # Копируем CFG файлы
          echo "  📄 Copying CFG files..."
          cp -r cfg/* "${RELEASE_DIR}/cfg/" 2>/dev/null || true
          
          # Копируем документацию
          echo "  📄 Copying documentation..."
          for doc in README.md LICENSE BENCHMARKS.md ML_READINESS.md AUDIT_REPORT_*.md BUILD_REPORT_*.md TEST_REPORT_*.md; do
            if [ -f "$doc" ]; then
              cp "$doc" "${RELEASE_DIR}/" 2>/dev/null || true
            fi
          done
          
          # Копируем инструменты (если есть)
          echo "  📄 Copying tools..."
          cp -r tools "${RELEASE_DIR}/" 2>/dev/null || true
          
          # Копируем тесты (если есть)
          echo "  📄 Copying tests..."
          cp -r tests "${RELEASE_DIR}/" 2>/dev/null || true
          
          # Создаем архив
          echo "  📦 Creating ZIP archive..."
          zip -r "${RELEASE_ZIP}" "${RELEASE_DIR}" -x "*.git*" "*__pycache__*" "*.pyc"
          
          echo "✅ Package created: ${RELEASE_ZIP}"
          ls -lh "${RELEASE_ZIP}"
      
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-v${{ env.PLUGIN_VERSION }}-package
          path: ${{ env.PROJECT_NAME }}.v${{ env.PLUGIN_VERSION }}.zip

  # ============================================
  # 7. СОЗДАНИЕ РЕЛИЗА НА GITHUB
  # ============================================
  release-on-tag:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, static-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-v${{ env.PLUGIN_VERSION }}-package
          path: release-assets
      
      - name: Generate release notes
        run: |
          echo "# Iron Sentinel ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "## 🚀 What's New" >> release-notes.md
          echo "" >> release-notes.md
          echo "- CI/CD pipeline improvements" >> release-notes.md
          echo "- Bug fixes and performance enhancements" >> release-notes.md
          echo "" >> release-notes.md
          echo "## 📦 Installation" >> release-notes.md
          echo "" >> release-notes.md
          echo "1. Download the package" >> release-notes.md
          echo "2. Extract to your CS:GO/CS2 server" >> release-notes.md
          echo "3. Restart the server" >> release-notes.md
      
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ZIP="${{ env.PROJECT_NAME }}.v${{ env.PLUGIN_VERSION }}.zip"
          
          echo "📤 Creating release: ${{ github.ref_name }}"
          
          # Создаем релиз (если не существует)
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "Iron Sentinel ${{ github.ref_name }}" \
              --notes-file release-notes.md
          
          # Загружаем ассет
          echo "📤 Uploading: ${RELEASE_ZIP}"
          gh release upload "${GITHUB_REF_NAME}" "release-assets/${RELEASE_ZIP}" --clobber
          
          echo "✅ Release created successfully!"

  # ============================================
  # 8. УВЕДОМЛЕНИЯ (ОПЦИОНАЛЬНО)
  # ============================================
  notify:
    needs: [static-tests, sourcemod-build, package, release-on-tag]
    if: always() && (failure() || success())
    runs-on: ubuntu-latest
    steps:
      - name: Check workflow status
        run: |
          echo "📊 Workflow Status Summary"
          echo "=========================="
          echo "✅ Static Tests: ${{ needs.static-tests.result }}"
          echo "✅ Lint: ${{ needs.lint-sourcepawn.result }}"
          echo "✅ Version Check: ${{ needs.version-check.result }}"
          echo "✅ Build: ${{ needs.sourcemod-build.result }}"
          echo "✅ Tests: ${{ needs.test-plugin.result }}"
          echo "✅ Package: ${{ needs.package.result }}"
          
          if [ "${{ needs.sourcemod-build.result }}" = "success" ]; then
            echo "🎉 All checks passed! Plugin ready for release."
          else
            echo "❌ Some checks failed. Please review the logs."
          fi
      
      - name: Send Discord notification (optional)
        if: false  # Включите, если есть Discord webhook
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Iron Sentinel CI"
          description: |
            **Version:** ${{ env.PLUGIN_VERSION }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
          color: ${{ job.status == 'success' && '3066993' || '15158332' }}

  # ============================================
  # 9. ОЧИСТКА КЕША (ЕЖЕДНЕВНО)
  # ============================================
  cleanup-cache:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old caches
        run: |
          echo "🧹 Cleaning up old caches..."
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -X DELETE \
            "https://api.github.com/repos/${{ github.repository }}/actions/caches"
        continue-on-error: true
